<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="jarvis">
        <div class="core"></div>
        <h1>J.A.R.V.I.S</h1>
        <p id="status">System Ready</p>

        <button id="startBtn">🎙️ Start JARVIS</button>

        <div class="output">
            <p><strong>You:</strong> <span id="userText">...</span></p>
            <p><strong>JARVIS:</strong> <span id="jarvisText">How can I help you?</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
